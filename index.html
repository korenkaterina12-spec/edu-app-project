<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
      <h1>IdApp</h1>
      <output id="level">1</output>
      <output id="score">0</output>
    </header>
    <main>
       <form onsubmit="check(event)">
            <p>What flag is it?</p>
            <input type="text" id="userAnswer" placeholder="Type your answer here" required>
            <button type="submit">Submit </button>
        </form>
         <video id="videoPlayer" width="640" height="360" controls poster="OIP-1331049503.jpg">
        </video>
    </main>
</body>
</html>
